name = "galaxy-live-relay"
main = "src/index.ts"
compatibility_date = "2026-01-01"

[[durable_objects.bindings]]
name = "RELAY"
class_name = "RelayDO"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["RelayDO"]

[vars]
FD_WS = "wss://gui.firedancer.io/websocket"                # the Firedancer dashboard to follow
IDENTITY = ""    # the validator to follow (identity key); empty: the dashboard's own
VOTE = ""        # its vote account, with IDENTITY
RPC_URL = "https://api.mainnet-beta.solana.com"
APP = "galaxy-live"                                         # the badge app's id (app.json)
BADGE_SERVER = "https://badge-api.solana.com"
FRAME_MS = "100"

# main.lua and the phone page ship inside the Worker (GET /app/main.lua, /install)
[[rules]]
type = "Text"
globs = ["**/*.lua", "**/*.html"]
fallthrough = true

# Files too big or too private for the code: the Android app (android/build.sh), put with
#   npx wrangler kv key put --binding FILES galaxy-live.apk --path ../android/build/galaxy-live.apk --remote
[[kv_namespaces]]
binding = "FILES"
id = "c912f1d378e34a77be0e27045ff2592f"
